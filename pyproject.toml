[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressless"
version = "0.0.0"
description = "The desktop app that lets a writer manage and publish their own static site, without needing anyone else to do it for them."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The operating system's credential store, reached only by
# src/pressless/credentials.py (PRESS-0002, ADR-0003). A FLOOR, not a hold
# (dependencies.md §4): 25 is the oldest release where .backends on a chain
# and errors.NoKeyringError behave as §4.6 records. Nothing caps it, so the
# newest release is what installs.
dependencies = ["keyring>=25"]

# The gate's tools (scripts/local-ci.sh). Floors record what was measured, not
# a ceiling: CI installs whatever is newest above them, so a release that
# breaks us shows up here rather than months later.
[project.optional-dependencies]
# pytest-randomly randomises test order. PRESS-0027: it was auto-loading on
# the maintainer's machine and absent in CI, so the two ran the suite
# differently. Declared rather than removed -- random order is the check
# that catches a test passing only because an earlier one ran first, and
# the seed it prints in the run header reproduces any failure.
dev = ["pytest>=9", "pytest-randomly>=4", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
# --strict-markers is the whole mechanism (python.md § Tests): declaring
# `markers` alone only silences the warning for names already listed, so a
# typo'd label still exits 0 and silently drops out of a `-m` selection.
addopts = "--strict-markers"
markers = [
    "archive: exercises the real WordPress export; requires PRESSLESS_ARCHIVE and is skipped cleanly otherwise (PRESS-0004 INV-5)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Without an explicit `select`, ruff runs E4/E7/E9 + F only -- so the
# line-length above was declared and never enforced, and the bug and
# security rule sets were off (PRESS-0077). Chosen, not inherited.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle -- this is what makes line-length bite
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear -- the mutable-default and loop-variable classes
    "S",    # bandit -- this project handles a publishing key
    "UP",   # pyupgrade, held to target-version
]

[tool.ruff.lint.per-file-ignores]
# A test asserts. S101 is bandit objecting to the whole practice.
"tests/*" = ["S101"]
# S314: these three parse the writer's OWN WordPress export, from a path he
# configured -- not untrusted input off a network. defusedxml would be a
# dependency bought to silence a check about a threat that is not present.
"tests/test_marks_archive.py" = ["S101", "S314"]
"tests/test_store_archive.py" = ["S101", "S314"]
"tests/test_store_extras_archive.py" = ["S101", "S314"]
# S310: both urlopen call sites build their URL from a module-level literal
# (`API`), so the scheme is never attacker-chosen. Suppressed rather than
# guarded because the guard would be a second place to keep the scheme true;
# if `request()` ever takes a URL from outside, this ignore must go.
"src/pressless/publisher.py" = ["S310"]
"src/pressless/insights.py" = ["S310"]
