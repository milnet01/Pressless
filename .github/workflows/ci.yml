# The pipeline holds NO checks of its own. It installs what the gate needs and
# runs scripts/local-ci.sh -- the same file the pre-push hook runs, so the
# local run and this one cannot drift (commits.md § 4.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. The gate sweeps every commit and every
      # commit message for the writer's name; a shallow clone has neither, and
      # would report a clean sweep of history it never fetched.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # The gate only reads. Leaving the token in .git/config would let
          # any later step push with it.
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Gate
        run: ./scripts/local-ci.sh
