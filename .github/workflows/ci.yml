# The pipeline holds NO checks of its own. It installs what the gate needs and
# runs scripts/local-ci.sh -- the same file the pre-push hook runs, so the
# local run and this one cannot drift (commits.md § 4.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; a push to main
# never cancels one, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Windows too, on every push: the writer is on Windows, and until this job
    # the suite ran there only at a release tag, where its first run failed
    # (PRESS-0120). Both systems run the same script; neither can cancel the
    # other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A green run takes about two minutes on either system. A hung test would
    # otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 is load-bearing. The gate sweeps every commit and every
      # commit message for the writer's name; a shallow clone has neither, and
      # would report a clean sweep of history it never fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The gate only reads. Leaving the token in .git/config would let
          # any later step push with it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Gate
        run: ./scripts/local-ci.sh
