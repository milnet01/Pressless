# The shared pre-push hook's keys for this repository (local-gate.md § 6.2),
# committed so a fresh clone has them. A key in the clone's own git config
# wins. Why this list: CLAUDE.md § Build and test. Root markdown files are
# named one by one because a test reads CHANGELOG.md; a new one runs the
# whole gate until it is added.
[ants "gate"]
	docsGlob = "docs/*|*/*.md|README.md|CLAUDE.md|ROADMAP.md|SECURITY.md|PRIVACY.md|LICENSE|*.rst"
